name: Release

# One game per release: a tag game/<id>/v<version> builds and publishes that
# game. The version must equal config/version in games/<id>/project.godot.
on:
  push:
    tags:
      - "game/*/v*"
  workflow_dispatch:
    inputs:
      game:
        description: Game id under games/ (optional while only one game is registered)
        required: false
        type: string
      engine_version:
        description: Optional Godot version override for this build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      engine_version: ${{ steps.engine.outputs.version }}
      game: ${{ steps.release.outputs.game }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # On a tag build, fails unless the tag is exactly game/<id>/v<version>
      # with the version in that game's project.godot.
      - name: Resolve game and version
        id: release
        run: node tools/ci.js release --game "${{ inputs.game }}"

      - name: Resolve Godot version
        id: engine
        env:
          INPUT_ENGINE_VERSION: ${{ inputs.engine_version }}
        run: node tools/ci.js engine-version

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.engine.outputs.version }}
          use-dotnet: false
          include-templates: false

      - name: Validate repository and game
        run: node tools/validate.js --game ${{ steps.release.outputs.game }} --godot-bin godot --clean-import

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            preset: Windows Desktop
            package: "*-windows-x86_64.zip"
          - name: Linux
            preset: Linux
            package: "*-linux-x86_64.tar.gz"
          - name: Web
            preset: Web
            package: "*-web.zip"
    env:
      GAMEBASE_GAME: ${{ needs.validate.outputs.game }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/web_smoke/package-lock.json

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ needs.validate.outputs.engine_version }}
          use-dotnet: false
          include-templates: true

      - name: Export
        run: node tools/export.js --godot-bin godot --preset "${{ matrix.preset }}" --skip-validation ${{ inputs.engine_version && '--allow-engine-drift' || '' }}

      - name: Verify Web payload
        if: matrix.name == 'Web'
        run: node tools/smoke_export.js --target Web

      - name: Install Web smoke dependencies
        if: matrix.name == 'Web'
        run: npm ci --prefix tools/web_smoke

      - name: Install Chromium
        if: matrix.name == 'Web'
        run: npm exec --prefix tools/web_smoke -- playwright install --with-deps chromium

      - name: Browser smoke Web export
        if: matrix.name == 'Web'
        run: npm run --prefix tools/web_smoke smoke:web

      - name: Upload Web smoke diagnostics
        if: matrix.name == 'Web' && always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-web-smoke-release
          path: artifacts/${{ needs.validate.outputs.game }}/web-smoke
          if-no-files-found: ignore
          retention-days: 30

      - name: Package deterministically
        run: node tools/package_release.js --target "${{ matrix.name }}"

      - name: Upload packaged build
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: dist/${{ needs.validate.outputs.game }}/${{ matrix.package }}
          if-no-files-found: error
          retention-days: 30

  native-smoke:
    name: Native smoke ${{ matrix.name }}
    needs: [validate, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: release-Windows
          - name: Linux
            os: ubuntu-latest
            artifact: release-Linux
    runs-on: ${{ matrix.os }}
    env:
      GAMEBASE_GAME: ${{ needs.validate.outputs.game }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download packaged build
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ needs.validate.outputs.game }}

      - name: Smoke packaged build
        run: node tools/smoke_export.js --target ${{ matrix.name }} --from-package

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/game/') && (github.event_name != 'workflow_dispatch' || inputs.engine_version == '')
    needs: [validate, build, native-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GAMEBASE_GAME: ${{ needs.validate.outputs.game }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download packaged builds
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist/${{ needs.validate.outputs.game }}
          merge-multiple: true

      - name: Validate release tag
        run: node tools/ci.js release

      - name: Validate packages and generate release manifest
        run: node tools/generate_release_manifest.js --engine-version "${{ needs.validate.outputs.engine_version }}" --git-commit "${{ github.sha }}" --tag "${{ github.ref_name }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci.js publish-release --game ${{ needs.validate.outputs.game }}
