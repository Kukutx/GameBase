name: Addon Freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: addon-freshness
  cancel-in-progress: true

jobs:
  check:
    name: Check vendored addon updates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Compare upstream stable tags
        id: addons
        run: node tools/check_addon_updates.js

      - name: Publish report to the run summary
        run: node tools/ci.js append-summary --file artifacts/addon-updates.md

      # Creates or refreshes one maintenance issue while an update exists and
      # closes it once the vendored versions are current. Addon code is never
      # replaced by this workflow.
      - name: Maintain the addon update issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci.js addon-issue --updates-available ${{ steps.addons.outputs.updates_available }}
