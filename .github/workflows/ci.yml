name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      engine_version:
        description: Optional Godot version override for this run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve Godot version
        id: engine
        env:
          INPUT_ENGINE_VERSION: ${{ inputs.engine_version }}
        run: node tools/ci.js engine-version

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.engine.outputs.version }}
          use-dotnet: false
          include-templates: true

      - name: Validate project
        run: node tools/validate.js --godot-bin godot --clean-import

  export:
    name: Export ${{ matrix.name }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            preset: Windows Desktop
            artifact: gamebase-windows
            path: build/windows
          - name: Linux
            preset: Linux
            artifact: gamebase-linux
            path: build/linux
          - name: Web
            preset: Web
            artifact: gamebase-web
            path: build/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/web_smoke/package-lock.json

      - name: Resolve Godot version
        id: engine
        env:
          INPUT_ENGINE_VERSION: ${{ inputs.engine_version }}
        run: node tools/ci.js engine-version

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.engine.outputs.version }}
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --path . --import

      - name: Export
        run: node tools/export.js --godot-bin godot --preset "${{ matrix.preset }}" --skip-validation ${{ inputs.engine_version && '--allow-engine-drift' || '' }}

      - name: Verify Web payload
        if: matrix.name == 'Web'
        run: node tools/smoke_export.js --target Web

      - name: Install Web smoke dependencies
        if: matrix.name == 'Web'
        run: npm ci --prefix tools/web_smoke

      - name: Install Chromium
        if: matrix.name == 'Web'
        run: npm exec --prefix tools/web_smoke -- playwright install --with-deps chromium

      - name: Browser smoke Web export
        if: matrix.name == 'Web'
        run: npm run --prefix tools/web_smoke smoke:web

      - name: Upload Web smoke diagnostics
        if: matrix.name == 'Web' && always()
        uses: actions/upload-artifact@v4
        with:
          name: gamebase-web-smoke
          path: artifacts/web-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

  native-smoke:
    name: Native smoke ${{ matrix.name }}
    needs: export
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: gamebase-windows
            path: build/windows
          - name: Linux
            os: ubuntu-latest
            artifact: gamebase-linux
            path: build/linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download exported game
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

      - name: Launch exported build
        run: node tools/smoke_export.js --target ${{ matrix.name }}
