name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      engine_version:
        description: Optional Godot version override for this run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Picks the games this run covers: every game, except on a pull request that
  # changes nothing but some games' own directories, and none on one that
  # changes documentation alone.
  plan:
    name: Plan games
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      games: ${{ steps.games.outputs.games }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Select games
        id: games
        run: node tools/ci.js games ${{ github.event_name == 'pull_request' && '--changed-from HEAD^1' || '' }}

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve Godot version
        id: engine
        env:
          INPUT_ENGINE_VERSION: ${{ inputs.engine_version }}
        run: node tools/ci.js engine-version

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.engine.outputs.version }}
          use-dotnet: false
          include-templates: false

      - name: Validate repository and the new-game scaffold
        run: node tools/validate.js --no-games --godot-bin godot

  validate:
    name: Validate ${{ matrix.game }}
    needs: plan
    if: needs.plan.outputs.games != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.plan.outputs.games) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve Godot version
        id: engine
        env:
          INPUT_ENGINE_VERSION: ${{ inputs.engine_version }}
        run: node tools/ci.js engine-version

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.engine.outputs.version }}
          use-dotnet: false
          include-templates: false

      - name: Validate game
        run: node tools/validate.js --no-repository --game ${{ matrix.game }} --godot-bin godot --clean-import

  export:
    name: Export ${{ matrix.game }} ${{ matrix.target.name }}
    needs: [plan, repository, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.plan.outputs.games) }}
        target:
          - name: Windows
            preset: Windows Desktop
            dir: windows
          - name: Linux
            preset: Linux
            dir: linux
          - name: Web
            preset: Web
            dir: web
    env:
      GAMEBASE_GAME: ${{ matrix.game }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/web_smoke/package-lock.json

      - name: Resolve Godot version
        id: engine
        env:
          INPUT_ENGINE_VERSION: ${{ inputs.engine_version }}
        run: node tools/ci.js engine-version

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.engine.outputs.version }}
          use-dotnet: false
          include-templates: true

      - name: Export
        run: node tools/export.js --godot-bin godot --preset "${{ matrix.target.preset }}" --skip-validation ${{ inputs.engine_version && '--allow-engine-drift' || '' }}

      - name: Verify Web payload
        if: matrix.target.name == 'Web'
        run: node tools/smoke_export.js --target Web

      - name: Install Web smoke dependencies
        if: matrix.target.name == 'Web'
        run: npm ci --prefix tools/web_smoke

      - name: Install Chromium
        if: matrix.target.name == 'Web'
        run: npm exec --prefix tools/web_smoke -- playwright install --with-deps chromium

      - name: Browser smoke Web export
        if: matrix.target.name == 'Web'
        run: npm run --prefix tools/web_smoke smoke:web

      - name: Upload Web smoke diagnostics
        if: matrix.target.name == 'Web' && always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.game }}-web-smoke
          path: artifacts/${{ matrix.game }}/web-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.game }}-${{ matrix.target.dir }}
          path: build/${{ matrix.game }}/${{ matrix.target.dir }}
          if-no-files-found: error
          retention-days: 7

  native-smoke:
    name: Native smoke ${{ matrix.game }} ${{ matrix.target.name }}
    needs: [plan, export]
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.plan.outputs.games) }}
        target:
          - name: Windows
            os: windows-latest
            dir: windows
          - name: Linux
            os: ubuntu-latest
            dir: linux
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 15
    env:
      GAMEBASE_GAME: ${{ matrix.game }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download exported game
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.game }}-${{ matrix.target.dir }}
          path: build/${{ matrix.game }}/${{ matrix.target.dir }}

      - name: Launch exported build
        run: node tools/smoke_export.js --target ${{ matrix.target.name }}

  # The one check branch protection requires: it fails when any job above
  # failed or was cancelled, and passes when the jobs a documentation change
  # skips had nothing to do.
  result:
    name: CI result
    needs: [plan, repository, validate, export, native-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Judge the run
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node tools/ci.js result
