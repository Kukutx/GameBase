name: Godot Compatibility

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      engine_version:
        description: Optional stable Godot 4.x version override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: godot-compatibility
  cancel-in-progress: true

jobs:
  latest-stable:
    name: Latest stable Godot 4.x
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Without an override this resolves the newest stable release of
      # godotengine/godot; the shared baseline in .godot-version is not moved.
      - name: Resolve target Godot version
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ENGINE_VERSION: ${{ inputs.engine_version }}
        run: node tools/ci.js engine-version --latest

      - name: Setup target Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.engine.outputs.version }}
          use-dotnet: false
          include-templates: true

      - name: Validate every game against target engine
        run: node tools/validate.js --godot-bin godot --clean-import

      - name: Verify the release exports of every game
        run: node tools/export.js --all --godot-bin godot --skip-validation --allow-engine-drift

      - name: Compatibility summary
        if: always()
        run: node tools/ci.js compat-summary --baseline "${{ steps.engine.outputs.baseline }}" --version "${{ steps.engine.outputs.version }}"
